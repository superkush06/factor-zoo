[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-zoo"
version = "0.5.4"
description = "Equity-factor reproductions: momentum / value / size / quality / low-vol / reversal with Fama-MacBeth."
authors = [{name = "superkush06"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# Upper bound is deliberate, not superstition: every number this library
# publishes is a floating-point reduction, and reduction order is not part of
# NumPy's API contract. 2.x is what CI runs; 3.x is untested here.
dependencies = ["numpy>=1.24,<3"]

[project.urls]
Homepage = "https://github.com/superkush06/factor-zoo"
Source = "https://github.com/superkush06/factor-zoo"
Changelog = "https://github.com/superkush06/factor-zoo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["fz*"]

[tool.pytest.ini_options]
# `fz` is a testpath because the docstring examples are run as doctests: an
# example printed in `help()` or in docs/api.md is a claim, and claims here
# are pinned. Same guarantee README's pycon blocks already have.
testpaths = ["tests", "fz"]
addopts = "-ra -q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E702"]
